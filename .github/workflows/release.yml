name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/release-notes-$version.md"
          echo "CHAR_VERSION=$version" >> "$GITHUB_ENV"
          swift --version
          node --version
          python3 --version
      - name: Build reproducible adapter examples
        run: |
          bash examples/integrations/minimax-code/native-adapter/build.sh
          node examples/integrations/minimax-code/build-packages.mjs
      - name: Project checks
        run: bash scripts/check.sh
      - name: Build universal release
        run: bash scripts/package-release.sh
      - name: Verify downloadable archive
        shell: bash
        run: |
          cd "build/release/$CHAR_VERSION"
          shasum -a 256 -c SHA256SUMS
          ditto -x -k "Char-$CHAR_VERSION-macos-universal.zip" verify-zip
          codesign --verify --deep --strict verify-zip/Char.app
          for executable in Char char-hook char-appearance-script; do
            archs=$(lipo -archs "verify-zip/Char.app/Contents/MacOS/$executable")
            [[ " $archs " == *" arm64 "* ]]
            [[ " $archs " == *" x86_64 "* ]]
          done
          ditto -x -k "Char-$CHAR_VERSION-examples.zip" verify-examples
          test -f verify-examples/Examples/minimax-code-cli.charintegration/manifest.json
          test -f verify-examples/Examples/minimax-code-desktop.charintegration/manifest.json
          test -f verify-examples/Examples/feibi.charpet/manifest.json
          hdiutil verify "Char-$CHAR_VERSION-macos-universal.dmg"
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/release/$CHAR_VERSION/Char-$CHAR_VERSION-macos-universal.zip" \
            "build/release/$CHAR_VERSION/Char-$CHAR_VERSION-macos-universal.dmg" \
            "build/release/$CHAR_VERSION/Char-$CHAR_VERSION-examples.zip" \
            "build/release/$CHAR_VERSION/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Char $GITHUB_REF_NAME — macOS" \
            --notes-file "docs/release-notes-$CHAR_VERSION.md"
